<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1 class="page-title">Output / Dashboard</h1>

    <section class="dashboard" aria-label="JavaScript demo dashboard">
      <div class="welcome-panel">
        <h2>Welcome to JavaScript</h2>
        <p class="instruction">Click the button to display a message.</p>

        <button id="messageButton" type="button">Click Me</button>

        <p id="message" class="message" aria-live="polite">
          Hello! JavaScript is working.
        </p>
      </div>

      <p class="caption">Sample output after clicking the button</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
